<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Math Quest ✨</title><style>
:root{font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 10%,#7054d9,transparent 35%),linear-gradient(155deg,#182452,#36236e 65%,#151d43);overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:980px;margin:auto;padding:20px 16px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:clamp(26px,5vw,44px);font-weight:1000;text-shadow:0 4px #22205d}.pill{background:#ffffff24;border:2px solid #ffffff35;border-radius:50px;padding:9px 15px;font-weight:900}.hero{text-align:center;padding:20px 8px 15px}.start-button{display:block;width:min(100%,380px);margin:24px auto 18px;border:4px solid #fff9b1;border-radius:25px;background:linear-gradient(180deg,#ffed72,#ffad32);color:#49315b;font-size:clamp(24px,5vw,34px);font-weight:1000;padding:22px 15px;box-shadow:0 9px 0 #a6631d,0 15px 30px #0005;animation:pulse 1.8s ease-in-out infinite}.start-button:active{transform:translateY(5px);box-shadow:0 3px 0 #a6631d}.pick-world{font-size:19px;font-weight:900;margin:22px 0 15px;text-align:center}@keyframes pulse{50%{filter:brightness(1.14)}}.hero h1{font-size:clamp(27px,5vw,49px);margin:8px}.hero p{opacity:.85;margin:5px}.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.world{border:3px solid #ffffff45;border-radius:25px;padding:20px 10px;min-height:165px;color:white;box-shadow:0 8px 0 #0003;transition:transform .15s}.world:active,.choice:active{transform:scale(.96)}.emoji{font-size:51px;display:block;filter:drop-shadow(0 5px 2px #0002)}.world strong{display:block;font-size:20px;margin:7px 0}.world small{font-size:13px;opacity:.9}.panel{background:#ffffff16;border:2px solid #ffffff30;border-radius:28px;padding:24px;text-align:center;max-width:750px;margin:20px auto;box-shadow:0 15px 35px #090e3030}.back{background:#ffffff25;color:white;border:0;border-radius:18px;padding:12px 17px;font-weight:800}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.level{background:linear-gradient(#ffdb69,#ffa635);border:0;border-radius:20px;padding:20px 5px;color:#54335a;box-shadow:0 7px #b96b30;font-weight:900}.level:disabled{opacity:.45;filter:grayscale(.6)}.level span{font-size:34px;display:block}.question{font-size:clamp(37px,9vw,74px);font-weight:1000;margin:15px 0 22px;text-shadow:0 5px #0002}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.choice{min-height:90px;border:3px solid #ffffff88;background:linear-gradient(135deg,#58d6ef,#478be6);border-radius:22px;color:white;font-size:clamp(27px,6vw,40px);font-weight:1000;box-shadow:0 7px #19468b}.choice:nth-child(2){background:linear-gradient(135deg,#fa8bb5,#ed5b82);box-shadow:0 7px #9b2f67}.choice:nth-child(3){background:linear-gradient(135deg,#7ee3aa,#2caf96);box-shadow:0 7px #16685e}.choice:nth-child(4){background:linear-gradient(135deg,#e4aeff,#9c78ee);box-shadow:0 7px #5840a3}.choice:disabled{opacity:.65}.progress{height:17px;background:#ffffff33;border-radius:50px;overflow:hidden;margin:15px 0}.fill{height:100%;background:linear-gradient(90deg,#ffd75b,#7ef3c2);transition:width .25s}.feedback{min-height:34px;font-size:23px;font-weight:900}.action{border:0;background:#ffcd48;border-radius:19px;padding:16px 26px;font-size:21px;font-weight:1000;color:#49315b;box-shadow:0 6px #b88123}.stars{font-size:40px;letter-spacing:5px}.muted{opacity:.8}.footer{text-align:center;opacity:.65;font-size:13px;margin-top:30px}.hide{display:none}.confetti{animation:bounce .45s ease-in-out alternate 3}@keyframes bounce{to{transform:translateY(-12px) scale(1.07)}}@media(max-width:620px){.worlds{grid-template-columns:repeat(2,1fr);gap:10px}.world{min-height:146px;padding:15px 5px}.world strong{font-size:17px}.emoji{font-size:41px}.panel{padding:17px}.levels{gap:7px}.level{padding:17px 2px;font-size:14px}.top .pill{font-size:13px;padding:8px}}
</style></head><body><main><div class="top"><div class="logo">🚀 Math Quest</div><div class="pill" id="score">⭐ 0 stars</div></div><div id="home"><div class="hero"><div style="font-size:70px">🦊✨🏰</div><h1>Explore the Six Kingdoms!</h1><p>Choose a world. Solve puzzles. Collect stars. Become a Math Hero!</p><button id="startGame" class="start-button" type="button">▶ START PLAYING!</button><div class="pick-world">✨ Or choose your favorite world below ✨</div></div><div class="worlds" id="worlds"></div><div class="footer">🌟 Every mistake is a chance to learn. You can do it! 🌟</div></div><div id="stage" class="hide"><button class="back" id="back">← Map</button><div class="panel"><div class="emoji" id="stageEmoji"></div><h1 id="stageTitle"></h1><p id="stageText" class="muted"></p><div class="levels" id="levels"></div><p class="muted">Beat a level to unlock the next challenge! 🔓</p></div></div><div id="play" class="hide"><button class="back" id="quit">← Levels</button><div class="panel"><div class="top"><span id="playTitle"></span><span id="counter"></span></div><div class="progress"><div class="fill" id="fill"></div></div><div id="mascot" style="font-size:65px">🦊</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button id="next" class="action hide">Next ➜</button></div></div><div id="win" class="hide"><div class="panel"><div style="font-size:95px" class="confetti">🏆</div><h1>LEVEL COMPLETE!</h1><div class="stars" id="winStars"></div><h2 id="winMessage"></h2><p id="winStats"></p><button class="action" id="continue">Keep Exploring! 🗺️</button></div></div></main><script>
const areas=[{name:'Addition',emoji:'🍭',bg:'linear-gradient(145deg,#ff7ab6,#e94c80)',desc:'Build numbers with magical candy!'},{name:'Subtraction',emoji:'🦖',bg:'linear-gradient(145deg,#6bcf9d,#249d89)',desc:'Help friendly dinosaurs find what is left!'},{name:'Multiplication',emoji:'🚀',bg:'linear-gradient(145deg,#6b9aff,#5365d8)',desc:'Launch rockets with times tables!'},{name:'Division',emoji:'🍕',bg:'linear-gradient(145deg,#ffa86c,#e7763b)',desc:'Share delicious pizza equally!'},{name:'Negative Numbers',emoji:'❄️',bg:'linear-gradient(145deg,#75d6f3,#427cce)',desc:'Explore numbers below zero!'},{name:'Decimals',emoji:'💎',bg:'linear-gradient(145deg,#bd8df7,#8255cb)',desc:'Collect sparkling decimal gems!'}];
const $=id=>document.getElementById(id);let save;try{save=JSON.parse(localStorage.getItem('mathquest-v1'))||{stars:0,unlocked:{},best:{}}}catch{save={stars:0,unlocked:{},best:{}}}let area=0,level=0,round=0,correct=0,questions=[],answered=false;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[rand(0,a.length-1)];function persist(){try{localStorage.setItem('mathquest-v1',JSON.stringify(save))}catch{}$('score').textContent='⭐ '+save.stars+' stars'}function show(id){['home','stage','play','win'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function unlocked(a,l){return l===0||!!save.unlocked[a+'-'+l]}function map(){show('home');$('worlds').innerHTML='';areas.forEach((a,i)=>{let b=document.createElement('button');b.className='world';b.style.background=a.bg;b.innerHTML=`<span class="emoji">${a.emoji}</span><strong>${a.name}</strong><small>${[0,1,2].filter(l=>save.best[i+'-'+l]!==undefined).length}/3 levels completed</small>`;b.onclick=()=>stage(i);$('worlds').append(b)})}function stage(i){area=i;show('stage');$('stageEmoji').textContent=areas[i].emoji;$('stageTitle').textContent=areas[i].name+' Kingdom';$('stageText').textContent=areas[i].desc;$('levels').innerHTML='';['Explorer','Adventurer','Champion'].forEach((n,l)=>{let b=document.createElement('button');b.className='level';b.disabled=!unlocked(i,l);b.innerHTML=`<span>${b.disabled?'🔒':['🌱','⚡','👑'][l]}</span>${n}<br><small>${save.best[i+'-'+l]!==undefined?'⭐ '+save.best[i+'-'+l]+'/3':'Level '+(l+1)}</small>`;b.onclick=()=>start(l);$('levels').append(b)})}function fmt(n){return Number(n.toFixed(2)).toString()}function makeQ(a,l){let x,y,ans,display,tip='';if(a===0){let max=[10,30,100][l];x=rand(0,max);y=rand(0,max);ans=x+y;display=`${x} + ${y} = ?`;tip='Put the two groups together.'}if(a===1){let max=[10,30,100][l];x=rand(1,max);y=rand(0,x);ans=x-y;display=`${x} − ${y} = ?`;tip='Count backwards or find the difference.'}if(a===2){x=rand(1,[5,10,12][l]);y=rand(1,[5,10,12][l]);ans=x*y;display=`${x} × ${y} = ?`;tip='Think of equal groups.'}if(a===3){y=rand(1,[5,10,12][l]);ans=rand(1,[5,10,12][l]);x=y*ans;display=`${x} ÷ ${y} = ?`;tip='Share into equal groups.'}if(a===4){if(l===0){x=rand(-9,9);y=rand(-5,5);ans=x+y;display=`${x} ${y<0?'−':'+'} ${Math.abs(y)} = ?`}else if(l===1){x=rand(-15,15);y=rand(-15,15);ans=x-y;display=`${x} − (${y}) = ?`}else{x=rand(-12,12);y=rand(-12,12);ans=x+y;display=`${x} + (${y}) = ?`}tip='Use a number line. Left is smaller; right is bigger.'}if(a===5){let scale=[10,10,100][l];x=rand(1,9*(scale===100?10:1))/scale;y=rand(1,9*(scale===100?10:1))/scale;if(l===1){ans=Number((x-y).toFixed(2));display=`${fmt(x)} − ${fmt(y)} = ?`}else{ans=Number((x+y).toFixed(2));display=`${fmt(x)} + ${fmt(y)} = ?`}tip='Line up the decimal points.'}return{display,ans,tip}}function options(ans,a,l){let set=new Set([ans]);let steps=a===5?[.1,.2,.3,.5,1]:[1,2,3,5,10];let attempts=0;while(set.size<4&&attempts++<100){let d=pick(steps)*pick([-2,-1,1,2]);let n=Number((ans+d).toFixed(2));if((a!==4&&a!==5&&n<0)||n===ans)continue;set.add(n)}return [...set].sort(()=>Math.random()-.5)}function start(l){level=l;round=0;correct=0;questions=Array.from({length:8},()=>makeQ(area,l));show('play');$('playTitle').textContent=areas[area].emoji+' '+areas[area].name+' • '+['Explorer','Adventurer','Champion'][l];draw()}function draw(){answered=false;let q=questions[round];$('counter').textContent=(round+1)+'/8';$('fill').style.width=round/8*100+'%';$('question').textContent=q.display;$('feedback').textContent='Pick the right answer!';$('mascot').textContent='🦊';$('next').classList.add('hide');$('answers').innerHTML='';options(q.ans,area,level).forEach(n=>{let b=document.createElement('button');b.className='choice';b.textContent=fmt(n);b.onclick=()=>answer(n);$('answers').append(b)})}function answer(n){if(answered)return;answered=true;let q=questions[round];let ok=Math.abs(n-q.ans)<.00001;if(ok)correct++;$('mascot').textContent=ok?'🥳':'💡';$('feedback').textContent=ok?pick(['Awesome! 🌟','You got it! 🎉','Brilliant! ✨','Super math power! 💪']):'Good try! '+q.tip+' Answer: '+fmt(q.ans);[...$('answers').children].forEach(b=>{b.disabled=true;if(Number(b.textContent)===q.ans)b.style.outline='5px solid #ffed81'});$('next').textContent=round===7?'See my treasure! 🏆':'Next ➜';$('next').classList.remove('hide')}function finish(){let stars=correct>=7?3:correct>=5?2:correct>=3?1:0;let key=area+'-'+level;let prev=save.best[key]||0;save.stars+=Math.max(0,stars-prev);save.best[key]=Math.max(stars,prev);if(correct>=5&&level<2)save.unlocked[area+'-'+(level+1)]=true;persist();show('win');$('winStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('winMessage').textContent=correct>=5?'Amazing adventure! 🎊':'Great practice, hero! 💛';$('winStats').textContent=`You got ${correct} out of 8 right! ${correct>=5?'The next level is ready if available.':'Get 5 right to unlock the next level. Try again!'}`;$('continue').onclick=()=>stage(area)}$('next').onclick=()=>{round++;if(round===8)finish();else draw()};$('startGame').onclick=()=>{area=0;start(0)};$('back').onclick=map;$('quit').onclick=()=>stage(area);persist();map();
</script></body></html>
